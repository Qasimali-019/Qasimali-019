<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <style>
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float1 { animation: float 4s ease-in-out infinite; }
    .float2 { animation: float 4s ease-in-out infinite 1.3s; }
    .float3 { animation: float 4s ease-in-out infinite 2.6s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .steam { animation: steam 2.5s ease-in-out infinite; opacity: .6; }
    @keyframes steam { 0% { transform: translateY(0); opacity: 0; } 40% { opacity: .6; } 100% { transform: translateY(-14px); opacity: 0; } }
  </style>

  <!-- background blob -->
  <ellipse cx="400" cy="230" rx="330" ry="170" fill="#eef2ff"/>
  <circle cx="140" cy="90" r="6" fill="#c7d2fe"/>
  <circle cx="690" cy="330" r="8" fill="#c7d2fe"/>
  <circle cx="610" cy="60" r="5" fill="#a5b4fc"/>

  <!-- floor line -->
  <line x1="60" y1="392" x2="740" y2="392" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- floating task cards (right) -->
  <g class="float1">
    <rect x="590" y="95" width="150" height="44" rx="8" fill="#fff" stroke="#34d399" stroke-width="2"/>
    <rect x="602" y="108" width="18" height="18" rx="4" fill="#34d399"/>
    <path d="M606 117 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="630" y="110" width="90" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="630" y="122" width="60" height="6" rx="3" fill="#e2e8f0"/>
  </g>
  <g class="float2">
    <rect x="610" y="155" width="150" height="44" rx="8" fill="#fff" stroke="#34d399" stroke-width="2"/>
    <rect x="622" y="168" width="18" height="18" rx="4" fill="#34d399"/>
    <path d="M626 177 l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="650" y="170" width="90" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="650" y="182" width="50" height="6" rx="3" fill="#e2e8f0"/>
  </g>
  <g class="float3">
    <rect x="590" y="215" width="150" height="44" rx="8" fill="#fff" stroke="#818cf8" stroke-width="2"/>
    <rect x="602" y="228" width="18" height="18" rx="4" fill="none" stroke="#818cf8" stroke-width="2"/>
    <rect x="630" y="230" width="90" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="630" y="242" width="70" height="6" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- plant (left) -->
  <path d="M120 392 l10 -70 h50 l10 70 z" fill="#f59e0b"/>
  <rect x="126" y="316" width="58" height="12" rx="3" fill="#d97706"/>
  <path d="M155 316 C150 260 110 240 95 200 C130 215 150 250 155 316" fill="#16a34a"/>
  <path d="M155 316 C160 250 190 230 215 190 C200 240 175 270 155 316" fill="#22c55e"/>
  <path d="M155 316 C145 270 140 220 150 165 C170 210 168 260 155 316" fill="#15803d"/>
  <path d="M155 316 C130 290 95 285 70 260 C105 258 135 275 155 316" fill="#22c55e"/>

  <!-- desk -->
  <rect x="220" y="285" width="360" height="14" rx="4" fill="#94a3b8"/>
  <rect x="235" y="299" width="12" height="93" fill="#64748b"/>
  <rect x="553" y="299" width="12" height="93" fill="#64748b"/>
  <!-- drawer unit -->
  <rect x="480" y="299" width="70" height="93" rx="4" fill="#cbd5e1"/>
  <rect x="490" y="312" width="50" height="22" rx="3" fill="#e2e8f0"/>
  <rect x="490" y="342" width="50" height="22" rx="3" fill="#e2e8f0"/>
  <rect x="508" y="320" width="14" height="4" rx="2" fill="#94a3b8"/>
  <rect x="508" y="350" width="14" height="4" rx="2" fill="#94a3b8"/>

  <!-- monitor -->
  <rect x="290" y="110" width="230" height="150" rx="10" fill="#1e293b"/>
  <rect x="300" y="120" width="210" height="130" rx="4" fill="#0f172a"/>
  <!-- code lines -->
  <rect x="312" y="134" width="40" height="6" rx="3" fill="#c084fc"/>
  <rect x="358" y="134" width="70" height="6" rx="3" fill="#38bdf8"/>
  <rect x="324" y="150" width="55" height="6" rx="3" fill="#4ade80"/>
  <rect x="385" y="150" width="80" height="6" rx="3" fill="#fbbf24"/>
  <rect x="324" y="166" width="90" height="6" rx="3" fill="#38bdf8"/>
  <rect x="336" y="182" width="60" height="6" rx="3" fill="#f472b6"/>
  <rect x="402" y="182" width="45" height="6" rx="3" fill="#4ade80"/>
  <rect x="336" y="198" width="100" height="6" rx="3" fill="#94a3b8"/>
  <rect x="324" y="214" width="30" height="6" rx="3" fill="#c084fc"/>
  <rect x="312" y="230" width="20" height="6" rx="3" fill="#38bdf8"/>
  <rect x="338" y="229" width="3" height="9" fill="#e2e8f0" class="blink"/>
  <!-- stand -->
  <rect x="395" y="260" width="20" height="18" fill="#334155"/>
  <rect x="370" y="276" width="70" height="9" rx="3" fill="#334155"/>

  <!-- coffee mug -->
  <rect x="535" y="258" width="24" height="27" rx="4" fill="#6366f1"/>
  <path d="M559 264 q10 0 10 9 q0 9 -10 9" stroke="#6366f1" stroke-width="4" fill="none"/>
  <path class="steam" d="M542 250 q-4 -6 0 -12 q4 -6 0 -12" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path class="steam" style="animation-delay:1.2s" d="M552 250 q-4 -6 0 -12 q4 -6 0 -12" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- chair -->
  <rect x="340" y="300" width="130" height="14" rx="6" fill="#475569"/>
  <rect x="399" y="314" width="12" height="52" fill="#334155"/>
  <path d="M360 382 L405 366 L450 382" stroke="#334155" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="360" cy="386" r="6" fill="#1e293b"/>
  <circle cx="450" cy="386" r="6" fill="#1e293b"/>

  <!-- person (from behind) -->
  <!-- torso / hoodie -->
  <path d="M352 305 C350 255 365 225 405 222 C445 225 460 255 458 305 Z" fill="#4f46e5"/>
  <!-- arms reaching to desk -->
  <path d="M362 255 C340 268 335 285 350 290" stroke="#4f46e5" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M448 255 C470 268 475 285 460 290" stroke="#4f46e5" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- hood line -->
  <path d="M380 228 Q405 248 430 228" stroke="#3730a3" stroke-width="4" fill="none"/>
  <!-- neck -->
  <rect x="396" y="208" width="18" height="18" rx="4" fill="#c68642"/>
  <!-- head -->
  <circle cx="381" cy="192" r="6" fill="#b5763a"/><circle cx="429" cy="192" r="6" fill="#b5763a"/><circle cx="405" cy="188" r="28" fill="#1f2937"/><path d="M385 205 Q405 216 425 205" stroke="#111827" stroke-width="3" fill="none"/>
  <!-- hair -->
  <path d="M377 186 C375 160 392 152 405 152 C420 152 436 160 433 186 C428 172 418 166 405 166 C392 166 382 172 377 186 Z" fill="#1f2937"/>
  <path d="M377 186 C378 200 383 208 390 212 L390 196 Z" fill="#1f2937"/>
  <path d="M433 186 C432 200 427 208 420 212 L420 196 Z" fill="#1f2937"/>
  <!-- headphones -->
  <path d="M374 186 C372 145 438 145 436 186" stroke="#111827" stroke-width="6" fill="none"/>
  <rect x="366" y="178" width="14" height="24" rx="6" fill="#ef4444"/>
  <rect x="430" y="178" width="14" height="24" rx="6" fill="#ef4444"/>

  <!-- music notes -->
  <g class="float2" fill="#818cf8">
    <circle cx="470" cy="95" r="5"/><rect x="474" y="73" width="2.5" height="22"/>
  </g>
  <g class="float1" fill="#a5b4fc">
    <circle cx="335" cy="88" r="4"/><rect x="338" y="70" width="2" height="18"/>
  </g>
</svg>
